plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbench.personal'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbench.personal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            // 调试包可直接安装，无需签名配置
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// 全部使用 Android 平台 API，不引入任何第三方依赖，构建快、体积小
dependencies {
}
